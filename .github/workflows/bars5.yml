# ========== Gold18K Pro · .github/workflows/bars5.yml ==========
# 📂 مسیر ریپو: .github/workflows/bars5.yml
# جمع‌آوری درون‌روزی (هر ۵ دقیقه) + تازه‌سازی دادهٔ بین‌بازاری (هر ساعت)، بدون VPS.
# توجه: در YAML فقط # کامنت است؛ // کل فایل را نامعتبر می‌کند.

name: bars5

on:
  schedule:
    # ریپوی عمومی: هر ۵ دقیقه · ریپوی خصوصی: "*/10 * * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bars5
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: نصب وابستگی
        run: pip install --quiet --disable-pip-version-check requests pandas

      - name: تنظیم هویت کامیت
        run: |
          git config user.name "gold18k-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: کندل درون‌روزی
        run: python collector.py --once --out data/bars5.csv --keep-days 45

      - name: کامیت کندل
        run: |
          git add data/bars5.csv
          if git diff --quiet --cached; then
            echo "بدون تغییر"
          else
            git commit -m "bars5: $(date -u +%FT%TZ)"
            git push
          fi

      - name: تازه‌سازی دادهٔ بین‌بازاری (هر ساعت)
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" -lt 5 ]; then
            python xasset.py || true
            git add data/xasset.csv
            if git diff --quiet --cached; then
              echo "xasset بدون تغییر"
            else
              git commit -m "xasset: $(date -u +%FT%TZ)"
              git push
            fi
          else
            echo "این نوبت نه — ساعت بعد"
          fi